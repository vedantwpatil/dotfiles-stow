  attribute:            { foreground: "#9CABCA" }

size:
  number_byte:          { foreground: "#DCD7BA" }
  number_kilo:          { foreground: "#7AA89F" }
  number_mega:          { foreground: "#7FB4CA" }
  number_giga:          { foreground: "#7E9CD8" }
  number_huge:          { foreground: "#957FB8" }
  unit_byte:            { foreground: "#727169" }
