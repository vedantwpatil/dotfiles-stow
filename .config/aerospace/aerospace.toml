# ~/.aerospace.toml
# Migrated from yabai + skhd

after-login-command = []
after-startup-command = ['exec-and-forget sketchybar']

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

# Matches yabai layout bsp
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Gaps — matches yabai 12px padding/gap, outer.top = 24 for your top bar
[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.bottom = 12
outer.top = 24
outer.right = 12

# ─── App workspace assignments (mirrors yabai rules) ──────────────────────────

[[on-window-detected]]
if.app-name-regex-substring = 'Microsoft Outlook'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-name-regex-substring = 'Messages'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-name-regex-substring = 'Spotify'
run = 'move-node-to-workspace 5'

# ─── Main bindings ────────────────────────────────────────────────────────────

[mode.main.binding]

# Focus window (alt-hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move/warp window (shift+alt-hjkl)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Balance window sizes (shift+alt-0)
alt-shift-0 = 'balance-sizes'

# Toggle fullscreen (alt-f)
alt-f = 'fullscreen'

# Toggle float/tile (alt-t)
alt-t = 'layout floating tiling'

# Layout toggles (alt-e toggles h/v, alt-comma = accordion)
alt-e = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Explicit split orientation — set before opening a new window
alt-minus = 'layout tiles vertical'   # force split below (top/bottom)
alt-slash = 'layout tiles horizontal' # force split beside (left/right)

# Resize (kept from original)
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Switch workspace (alt-1..9)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

# Move window to workspace and follow (shift+alt-1..9)
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

# Recent workspace (alt-tab)
alt-tab = 'workspace-back-and-forth'

# Move workspace to next monitor (shift+alt-tab)
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Send window to next/previous monitor and follow (shift+alt-n/p)
alt-shift-n = ['move-node-to-monitor next', 'focus-monitor next']
alt-shift-p = ['move-node-to-monitor prev', 'focus-monitor prev']

# ── App launchers ──────────────────────────────────────────────────────────────

# Ghostty Terminal (alt-i)
alt-i = 'exec-and-forget open -a /Applications/Ghostty.app'

# Spotify (alt-s)
alt-s = 'exec-and-forget open -a /Applications/Spotify.app'

# Helium (alt-b)
alt-b = 'exec-and-forget open -a /Applications/Helium.app'

# Join containers (alt-shift-arrows)
alt-shift-left = 'join-with left'
alt-shift-down = 'join-with down'
alt-shift-up = 'join-with up'
alt-shift-right = 'join-with right'

# ── Service mode ───────────────────────────────────────────────────────────────

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']                # reset layout
f = ['layout floating tiling', 'mode main']                # toggle float
backspace = ['close-all-windows-but-current', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# ─── Notes on yabai features with no AeroSpace equivalent ─────────────────────
# yabai window border (kanagawa theme via `borders`) — run `borders` separately
