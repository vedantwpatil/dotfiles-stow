# Font
font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
font_features    MapleMono-NF-Regular +liga +calt
font_features    MapleMono-NF-Bold +liga +calt
font_features    MapleMono-NF-Italic +liga +calt
font_features    MapleMono-NF-BoldItalic +liga +calt

# Transparency
background_opacity 0.9
background_blur    32

# Window
initial_window_width  120c
initial_window_height 35c
hide_window_decorations no

# Cursor
cursor_shape          block
cursor_blink_interval 0

# Interaction
mouse_hide_wait  -1
shell_integration no-cursor

# Colors — kanagawa-paper-ink
foreground           #DCD7BA
background           #1F1F28
selection_foreground #9e9b93
selection_background #363646
cursor               #c4b28a
cursor_text_color    background

# Normal
color0  #393836
color1  #c4746e
color2  #699469
color3  #c4b28a
color4  #435965
color5  #a292a3
color6  #8ea49e
color7  #c8c093

# Bright
color8  #aca9a4
color9  #cc928e
color10 #72a072
color11 #d4c196
color12 #698a9b
color13 #b4a7b5
color14 #96ada7
color15 #d5cd9d
color16 #b6927b
color17 #c4746e

# URL / marks / borders
url_color            #938aa9
mark1_foreground     background
mark1_background     #7aa89f
mark2_foreground     background
mark2_background     #a292a3
mark3_foreground     background
mark3_background     #b6927b
active_border_color   #c4b28a
inactive_border_color #625e5a
bell_border_color     #c4746e

# Tabs
tab_bar_background        #2a2a37
active_tab_foreground     #c4b28a
active_tab_background     #1f1f28
inactive_tab_foreground   #9e9b93
inactive_tab_background   #2a2a37
