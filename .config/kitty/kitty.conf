# Font
font_family      Maple Mono NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
font_features    MapleMono-NF-Regular +liga +calt
font_features    MapleMono-NF-Bold +liga +calt
font_features    MapleMono-NF-Italic +liga +calt
font_features    MapleMono-NF-BoldItalic +liga +calt

# Transparency
background_opacity 0.9
background_blur    32

# Window
initial_window_width  120c
initial_window_height 35c
hide_window_decorations no

# Cursor
cursor_shape          block
cursor_blink_interval 0

# Interaction
mouse_hide_wait  -1
shell_integration no-cursor

# Colors — kanagawa-paper-ink
foreground           #DCD7BA
background           #1F1F28
selection_foreground #9e9b93
selection_background #363646
cursor               #c4b28a
cursor_text_color    background

# Normal
color0  #393836
color1  #c4746e
color2  #699469
color3  #c4b28a
color4  #658594
color5  #a292a3
color6  #8ea49e
color7  #C8C093

# Bright
color8  #625e5a
color9  #E46876
color10 #8a9a7b
color11 #E6C384
color12 #859fac
color13 #938AA9
color14 #7AA89F
color15 #d5cea3
