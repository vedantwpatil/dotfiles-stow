# ══════════════════════════════════════════════════════════════
#  tmux.conf — Kanagawa Paper Ink
# ══════════════════════════════════════════════════════════════

# ── Terminal ──────────────────────────────────────────────────
set -g  default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 0
set -g  focus-events on
set -g  history-limit 50000

# ── General ───────────────────────────────────────────────────
set -g  mouse on
set-window-option -g aggressive-resize on

# ── Prefix ────────────────────────────────────────────────────
unbind C-b
set -g  prefix C-Space
bind    C-Space send-prefix

# ── Windows & panes ───────────────────────────────────────────
set -g  base-index 1
set -g  pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ── Vi mode ───────────────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v  send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y  send-keys -X copy-selection-and-cancel

# ── Splits (preserve cwd) ─────────────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ───────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Window navigation ─────────────────────────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H     previous-window
bind -n M-L     next-window

# ══════════════════════════════════════════════════════════════
#  Kanagawa Paper Ink — Color palette
#
#  Ink (backgrounds)   #16161D  #1F1F28  #2A2A37  #363646  #54546D
#  Paper (text)        #DCD7BA  #C8C093  #727169
#  Blue                #7E9CD8   Teal    #6A9589   Green   #76946A
#  Yellow              #C0A36E   Orange  #FFA066   Red     #C34043
#  Violet              #957FB8   Pink    #D27E99
#  Selection           #2D4F67
# ══════════════════════════════════════════════════════════════

# ── Status bar ────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1F1F28,fg=#DCD7BA"
set -g status-left-length 80
set -g status-right-length 140

# Left: session name
set -g status-left \
  "#[bg=#7E9CD8,fg=#16161D,bold]  #S #[bg=#1F1F28,fg=#7E9CD8,nobold]"

# Right: CPU · Battery · Clock · Date
set -g status-right \
  "#[fg=#363646,bg=#1F1F28]\
#[bg=#363646,fg=#727169] 󰻠 #{cpu_percentage} \
#[fg=#2A2A37,bg=#363646]\
#[bg=#2A2A37,fg=#C8C093] #{battery_icon_charge} #{battery_percentage} \
#[fg=#54546D,bg=#2A2A37]\
#[bg=#54546D,fg=#DCD7BA,bold]  %H:%M \
#[fg=#7E9CD8,bg=#54546D]\
#[bg=#7E9CD8,fg=#16161D,bold]  %d %b "

# ── Window tabs ───────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style         "bg=#1F1F28,fg=#54546D"
set -g window-status-format        " #I  #W  "
set -g window-status-current-style "bg=#1F1F28,fg=#7E9CD8,bold"
set -g window-status-current-format \
  "#[fg=#2A2A37,bg=#1F1F28]\
#[bg=#2A2A37,fg=#7E9CD8,bold] #I  #W \
#[fg=#2A2A37,bg=#1F1F28]"
set -g window-status-activity-style "bg=#1F1F28,fg=#FFA066,bold"

# ── Pane borders ──────────────────────────────────────────────
set -g pane-border-style        "fg=#363646"
set -g pane-active-border-style "fg=#7E9CD8"
set -g pane-border-lines        single

# ── Messages & copy mode ──────────────────────────────────────
set -g message-style         "bg=#2D4F67,fg=#DCD7BA"
set -g message-command-style "bg=#2A2A37,fg=#DCD7BA"
set -g mode-style            "bg=#2D4F67,fg=#DCD7BA"

# ══════════════════════════════════════════════════════════════
#  Plugins
# ══════════════════════════════════════════════════════════════
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'

# ── tmux-resurrect ────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# ── tmux-continuum ────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── tmux-sessionx ─────────────────────────────────────────────
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# ── tmux-battery icons (Nerd Fonts) ───────────────────────────
set -g @batt_icon_charge_tier8 '󰁹'
set -g @batt_icon_charge_tier7 '󰂁'
set -g @batt_icon_charge_tier6 '󰁿'
set -g @batt_icon_charge_tier5 '󰁾'
set -g @batt_icon_charge_tier4 '󰁽'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier2 '󰁻'
set -g @batt_icon_charge_tier1 '󰁺'
set -g @batt_icon_status_charged    '󰚥'
set -g @batt_icon_status_charging   '󰂄'
set -g @batt_icon_status_discharging '󱟤'

# ── TPM — keep at bottom ──────────────────────────────────────
run '~/.config/tmux/plugins/tpm/tpm'
