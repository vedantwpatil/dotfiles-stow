# ══════════════════════════════════════════════════════════════
#  tmux.conf — Kanagawa Paper Ink
# ══════════════════════════════════════════════════════════════

# ── Terminal ──────────────────────────────────────────────────
set -g  default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -sg escape-time 0
set -g  focus-events on
set -g  history-limit 50000

# ── General ───────────────────────────────────────────────────
set -g  mouse on
set-window-option -g aggressive-resize on

# ── Prefix ────────────────────────────────────────────────────
unbind C-b
set -g  prefix C-a
bind    C-a send-prefix

# ── Windows & panes ───────────────────────────────────────────
set -g  base-index 1
set -g  pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ── Vi mode ───────────────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v  send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y  send-keys -X copy-selection-and-cancel

# ── Splits (preserve cwd) ─────────────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ───────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Window navigation ─────────────────────────────────────────
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n M-H     previous-window
bind -n M-L     next-window

# ══════════════════════════════════════════════════════════════
#  Kanagawa Paper Ink — Color palette
#
#  bg        #1f1f28   surface  #2a2a37   select   #363646
#  fg        #dcd7ba   dim      #c8c093   muted    #727169
#  yellow    #c4b28a   red      #c4746e   green    #699469
#  blue      #859fac   teal     #6a9589   cyan     #8ea49e
#  pink      #a292a3   orange   #b6927b   violet   #8992a7
# ══════════════════════════════════════════════════════════════

# ── Status bar ────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1f1f28,fg=#dcd7ba"
set -g status-left-length 50
set -g status-right-length 80

# Left: session name + window count
set -g status-left \
  "#[bg=#2a2a37,fg=#c4b28a,bold]  #S #[fg=#727169,nobold] #{session_windows}w #[bg=#1f1f28,fg=#2a2a37]"

# Right: CPU · Battery · Time (12hr)
set -g status-right \
  "#[fg=#727169]󰻠 #[fg=#c8c093]#{cpu_percentage}  \
#[fg=#727169]#{battery_icon_charge} #[fg=#c8c093]#{battery_percentage}  \
#[fg=#727169]#[fg=#c4b28a,bold]%I:%M %p"

# ── Window tabs ───────────────────────────────────────────────
set -g window-status-separator "  "
set -g window-status-style         "bg=#1f1f28,fg=#727169"
set -g window-status-format        "#I #W"
set -g window-status-current-style "bg=#1f1f28,fg=#c4b28a,bold"
set -g window-status-current-format "#I #W"
set -g window-status-activity-style "bg=#1f1f28,fg=#c4746e"

# ── Pane borders ──────────────────────────────────────────────
set -g pane-border-style        "fg=#2a2a37"
set -g pane-active-border-style "fg=#c4b28a"
set -g pane-border-lines        single

# ── Messages & copy mode ──────────────────────────────────────
set -g message-style         "bg=#363646,fg=#dcd7ba"
set -g message-command-style "bg=#2a2a37,fg=#dcd7ba"
set -g mode-style            "bg=#363646,fg=#c8c093"

# ══════════════════════════════════════════════════════════════
#  Plugins
# ══════════════════════════════════════════════════════════════
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'

# ── tmux-resurrect ────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# ── tmux-continuum ────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ── tmux-sessionx ─────────────────────────────────────────────
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# ── tmux-battery icons (Nerd Fonts) ───────────────────────────
set -g @batt_icon_charge_tier8 '󰁹'
set -g @batt_icon_charge_tier7 '󰂁'
set -g @batt_icon_charge_tier6 '󰁿'
set -g @batt_icon_charge_tier5 '󰁾'
set -g @batt_icon_charge_tier4 '󰁽'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier2 '󰁻'
set -g @batt_icon_charge_tier1 '󰁺'
set -g @batt_icon_status_charged    '󰚥'
set -g @batt_icon_status_charging   '󰂄'
set -g @batt_icon_status_discharging '󱟤'

# ── TPM — keep at bottom ──────────────────────────────────────
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/tpm'"
run '~/.config/tmux/plugins/tpm/tpm'
